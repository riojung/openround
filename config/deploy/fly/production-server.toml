app = "openround-ca-server"
primary_region = "yyz"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "4000"
  WEB_ORIGIN = "https://openround-ca-web.fly.dev"
  PUBLIC_API_URL = "https://openround-ca-server.fly.dev"
  COOKIE_SECURE = "true"
  RUN_MIGRATIONS = "false"
  ALLOW_IN_MEMORY = "false"
  COMMUNITY_MODE = "false"
  MAX_PRACTICE_PERSONAL_LINKS = "100"
  BILLING_MODE = "stripe"
  FEATURE_SIGNUPS = "false"
  FEATURE_ROUND_EXPERIENCES = "false"
  FEATURE_AUDIENCE_PULSE = "false"
  FEATURE_ROOM_CHAT = "false"
  FEATURE_UX_BETA = "false"
  FEATURE_RECOVERY_REHEARSAL = "false"
  FEATURE_PRACTICE_ASSIGNMENTS = "false"
  FEATURE_WORKSPACE_SHELL = "false"
  FEATURE_BUILDER_V2 = "false"
  FEATURE_PRESENTATIONS = "false"
  FEATURE_GROUPS = "false"
  FEATURE_DISCOVER = "false"
  FEATURE_PRESENTATION_REALTIME = "false"
  FEATURE_RECOVERY_PACKS = "false"
  FEATURE_QUESTION_HEALTH = "false"
  FEATURE_DECISION_REPLAY = "false"
  FEATURE_RECOVERY_TRAILS = "false"
  FEATURE_CONCEPT_HEALTH = "false"
  FEATURE_EXTENDED_QUESTION_TYPES = "false"
  FEATURE_VERIFIED_INSTITUTION = "false"
  METRICS_ENABLED = "false"
  S3_REGION = "ca-central-1"
  SESSION_MUTATION_LEASE_TTL_MS = "15000"
  SESSION_MUTATION_LEASE_WAIT_MS = "5000"
  OPENROUND_MIGRATIONS_DIR = "/app/migrations"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
