global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: openround

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: openround
    metrics_path: /metrics
    static_configs:
      - targets: ["server:4000"]
        labels:
          deployment: local-compose

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
