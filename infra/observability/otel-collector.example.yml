extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: openround
          scheme: https
          metrics_path: /metrics
          authorization:
            type: Bearer
            credentials: ${env:OPENROUND_METRICS_TOKEN}
          static_configs:
            - targets: ["${env:OPENROUND_METRICS_TARGET}"]
              labels:
                deployment: "${env:OPENROUND_DEPLOYMENT}"

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlphttp/backend:
    endpoint: "${env:OPENROUND_OTLP_BACKEND_ENDPOINT}"
    headers:
      Authorization: "Bearer ${env:OPENROUND_OTLP_BACKEND_TOKEN}"
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/backend]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/backend]
  telemetry:
    logs:
      level: info
