name: Staging images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: single-vm-staging-images
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: single-vm-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # pinned upstream commit
        with:
          version: v0.68.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify main-branch candidate
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify HEAD)" = "$(git rev-parse --verify origin/main)"
      - name: Build, scan, sign, and verify staging images
        run: |
          set -euo pipefail
          api_url="$(jq -r '.publicApiUrl' config/deploy/staging.json)"
          registry="$(jq -r '.imageRepository' config/deploy/staging.json)"
          ./scripts/product-build.sh staging \
            --api-url "$api_url" \
            --registry "$registry" \
            --push \
            --manifest artifacts/deploy/staging/build-manifest.json
      - name: Validate signed manifest
        run: |
          set -euo pipefail
          manifest=artifacts/deploy/staging/build-manifest.json
          test "$(jq -r '.buildId' "$manifest")" = "$GITHUB_SHA"
          test "$(jq -r '.images.server.signed' "$manifest")" = true
          test "$(jq -r '.images.web.signed' "$manifest")" = true
          test "$(jq -r '.nextPublicApiUrl' "$manifest")" = "$(jq -r '.publicApiUrl' config/deploy/staging.json)"
      - name: Upload signed staging manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: single-vm-staging-manifest-${{ github.sha }}
          path: artifacts/deploy/staging/build-manifest.json
          if-no-files-found: error
          retention-days: 30
