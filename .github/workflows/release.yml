name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      candidate_commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require all pre-release single-VM beta gates
        run: pnpm readiness:require:beta:preflight
      - name: Verify signed semantic-version tag from main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be a v-prefixed semantic version without build metadata" >&2
            exit 1
          fi

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          local_tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME")"
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$tag_commit" origin/main

          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref")"
          test "$tag_object" = "$local_tag_object"
          if [[ "$GITHUB_SHA" != "$tag_object" && "$GITHUB_SHA" != "$tag_commit" ]]; then
            echo "The current tag no longer matches the tag-push event" >&2
            exit 1
          fi

          tag_details="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          test "$(jq -r '.object.type' <<<"$tag_details")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag_details")" = "$tag_commit"
          verification="$(jq -c '{verified: .verification.verified, reason: .verification.reason, verifiedAt: .verification.verified_at}' <<<"$tag_details")"
          test "$(jq -r '.verified' <<<"$verification")" = "true"
          test "$(jq -r '.reason' <<<"$verification")" = "valid"

          require_successful_workflow() {
            local workflow_file="$1"
            local workflow_label="$2"
            local runs
            local latest_run
            runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?head_sha=$tag_commit&per_page=100")"
            latest_run="$(
              jq -c --arg sha "$tag_commit" '
                [.[].workflow_runs[] | select(.head_sha == $sha)]
                | sort_by(.run_number, .run_attempt)
                | last
              ' <<<"$runs"
            )"
            if [[ "$latest_run" == "null" ]]; then
              echo "$workflow_label has no run for candidate commit $tag_commit" >&2
              exit 1
            fi
            if [[ "$(jq -r '.status' <<<"$latest_run")" != "completed" ]]; then
              echo "$workflow_label latest run for candidate commit $tag_commit is not completed" >&2
              exit 1
            fi
            if [[ "$(jq -r '.conclusion' <<<"$latest_run")" != "success" ]]; then
              echo "$workflow_label latest run for candidate commit $tag_commit did not succeed" >&2
              exit 1
            fi
            jq -c \
              --arg workflow "$workflow_label" \
              '{workflow: $workflow, runId: .id, runNumber: .run_number, runAttempt: .run_attempt, event: .event, status: .status, conclusion: .conclusion, url: .html_url, commit: .head_sha, startedAt: .run_started_at, completedAt: .updated_at}' \
              <<<"$latest_run"
          }

          ci_run="$(require_successful_workflow ci.yml CI)"
          security_run="$(require_successful_workflow security.yml Security)"
          production_smoke_run="$(require_successful_workflow production-smoke.yml Production-path-smoke)"

          mkdir -p artifacts/release
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$tag_commit" \
            --arg tagObject "$tag_object" \
            --argjson verification "$verification" \
            --argjson ciRun "$ci_run" \
            --argjson securityRun "$security_run" \
            --argjson productionSmokeRun "$production_smoke_run" \
            '{schemaVersion: 1, tag: $tag, commit: $commit, tagObject: $tagObject, onOriginMain: true, verification: $verification, candidateWorkflows: {ci: $ciRun, security: $securityRun, productionSmoke: $productionSmokeRun}}' \
            > artifacts/release/preflight.json
      - name: Upload release preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preflight-${{ github.ref_name }}
          path: artifacts/release/preflight.json
          if-no-files-found: warn
          retention-days: 90

  images:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241 # pinned upstream commit
        with:
          version: v0.68.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build and push unsigned release candidates
        id: build
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "${{ needs.preflight.outputs.candidate_commit }}"
          api_url="$(jq -r '.publicApiUrl' config/deploy/production.json)"
          ./scripts/product-build.sh production \
            --api-url "$api_url" \
            --registry "ghcr.io/${GITHUB_REPOSITORY}/openround" \
            --push \
            --prepare \
            --manifest artifacts/deploy/production/build-manifest.json
      - name: Record immutable release references
        id: manifest
        if: always()
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          manifest=artifacts/deploy/production/build-manifest.json
          test "$(jq -r '.buildId' "$manifest")" = "$EXPECTED_COMMIT"
          test "$(jq -r '.imagePlatform' "$manifest")" = "linux/amd64"
          for component in server web; do
            mkdir -p "artifacts/release/$component"
            jq -r ".images.$component.digest" "$manifest" \
              > "artifacts/release/$component/digest.txt"
            image_ref="$(jq -r ".images.$component.ref" "$manifest")"
            printf '%s\n' "$image_ref" > "artifacts/release/$component/ref.txt"
            echo "${component}_ref=$image_ref" >> "$GITHUB_OUTPUT"
          done
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: Scan server image
        id: server_scan
        if: always() && steps.manifest.outcome == 'success'
        with:
          scan-type: image
          image-ref: ${{ steps.manifest.outputs.server_ref }}
          format: sarif
          output: artifacts/release/server/trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          limit-severities-for-sarif: true
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && hashFiles('artifacts/release/server/trivy.sarif') != ''
        with:
          sarif_file: artifacts/release/server/trivy.sarif
          category: openround-server-image
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: Scan web image
        id: web_scan
        if: always() && steps.manifest.outcome == 'success'
        with:
          scan-type: image
          image-ref: ${{ steps.manifest.outputs.web_ref }}
          format: sarif
          output: artifacts/release/web/trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          limit-severities-for-sarif: true
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && hashFiles('artifacts/release/web/trivy.sarif') != ''
        with:
          sarif_file: artifacts/release/web/trivy.sarif
          category: openround-web-image
      - name: Scan, sign, and verify release images
        id: finalize
        if: >-
          always() &&
          steps.build.outcome == 'success' &&
          steps.manifest.outcome == 'success' &&
          steps.server_scan.outcome == 'success' &&
          steps.web_scan.outcome == 'success'
        run: |
          set -euo pipefail
          api_url="$(jq -r '.publicApiUrl' config/deploy/production.json)"
          ./scripts/product-build.sh production \
            --api-url "$api_url" \
            --registry "ghcr.io/${GITHUB_REPOSITORY}/openround" \
            --finalize \
            --manifest artifacts/deploy/production/build-manifest.json
      - name: Record signature verification evidence
        if: >-
          always() &&
          steps.finalize.outcome == 'success' &&
          steps.manifest.outcome == 'success' &&
          steps.server_scan.outcome == 'success' &&
          steps.web_scan.outcome == 'success'
        run: |
          set -euo pipefail
          for component in server web; do
            image_ref="$(cat "artifacts/release/$component/ref.txt")"
            cosign verify \
              --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --output json \
              "$image_ref" \
              > "artifacts/release/$component/cosign-verification.json"
          done
      - name: Upload server release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-server-${{ github.ref_name }}
          path: artifacts/release/server/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload web release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-web-${{ github.ref_name }}
          path: artifacts/release/web/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload deployment manifest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-deployment-manifest-${{ github.ref_name }}
          path: artifacts/deploy/production/build-manifest.json
          if-no-files-found: warn
          retention-days: 90
