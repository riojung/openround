name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          provenance: mode=max
          push: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}/openround-${{ matrix.component }}:${{ github.ref_name }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/openround-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: openround-${{ matrix.component }}-image
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository }}/openround-${{ matrix.component }}@${{ steps.build.outputs.digest }}
